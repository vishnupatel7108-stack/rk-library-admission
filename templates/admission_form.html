<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radha Krishn Library - Digital Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #f5f5f5; font-family: 'Segoe UI', sans-serif; padding: 15px; }
        .form-container { max-width: 550px; margin: 20px auto; background-color: #141414; border: 2px solid #b89734; border-radius: 12px; padding: 25px; box-shadow: 0 8px 35px rgba(184, 151, 52, 0.25); }
        .royal-header { font-family: 'Cinzel', serif; color: #b89734; text-align: center; font-size: 26px; letter-spacing: 1px; margin-bottom: 5px; }
        .sub-bar { text-align: center; color: #aaa; font-size: 13px; margin-bottom: 25px; }
        .form-label { font-weight: 600; color: #ffffff; font-size: 15px; margin-bottom: 8px; display: block; }
        
        /* ✨ TYPE KARNE WALE BOXES KO SAID AUR CHAMKILA BANANE KE LIYE */
        .form-control { 
            background-color: #222222 !important; 
            color: #ffffff !important; 
            border: 2px solid #ffc107 !important; /* Gold border jo door se dikhegi */
            border-radius: 8px; 
            padding: 12px; 
            font-size: 16px;
        }
        /* Typing box ke andar ka placeholder text gray dikhega */
        .form-control::placeholder {
            color: #888888 !important;
            font-size: 14px;
        }
        /* Jab student box par click karega toh border aur zyada chamkegi */
        .form-control:focus { 
            border-color: #ffffff !important; 
            box-shadow: 0 0 12px rgba(255, 193, 7, 0.6) !important; 
            background-color: #2a2a2a !important;
        }

        .btn-gold-action { background-color: #b89734; color: #000; font-weight: bold; border: none; padding: 14px; font-size: 16px; border-radius: 6px; width: 100%; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; }
        .btn-gold-action:hover { background-color: #ffc107; box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4); }
        .required-star { color: #dc3545; font-weight: bold; }
        .photo-preview-box { width: 100%; height: 200px; background-color: #222; border: 2px dashed #ffc107; border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-top: 10px; color: #aaa; overflow: hidden; }
        .photo-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="text-center mb-2"><i class="fa fa-feather text-success" style="font-size: 30px; text-shadow: 0 0 10px #b89734;"></i></div>
        <h2 class="royal-header">RADHA KRISHN LIBRARY</h2>
        <p class="sub-bar">Digital Admission Roster</p>
        
        <form action="/submit-admission" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Student Full Name <span class="required-star">*</span></label>
                <input type="text" name="student_name" class="form-control" placeholder="Yahan apna poora naam likhein..." required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Father's Name <span class="required-star">*</span></label>
                <input type="text" name="father_name" class="form-control" placeholder="Yahan pita ka naam likhein..." required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Mobile Number <span class="required-star">*</span></label>
                <input type="tel" name="mobile_number" class="form-control" pattern="[0-9]{10}" placeholder="10 digit ka mobile number dalein..." required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Complete Address <span class="required-star">*</span></label>
                <textarea name="address" class="form-control" rows="2" placeholder="Apna poora pata yahan likhein..." required></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Preparing For (Target Exam) <span class="required-star">*</span></label>
                <input type="text" name="preparing_for" class="form-control" placeholder="Jaise: UPSC, SSC, Bank, REET, NEET..." required>
            </div>
            
            <div class="mb-4">
                <label class="form-label">Upload Profile Photo <span class="required-star">*</span></label>
                <input type="file" name="student_photo" id="photoInput" class="form-control" accept="image/*" required onchange="previewSelectedPhoto()">
                <div class="photo-preview-box" id="previewContainer"><i class="fa fa-camera me-2"></i> Click karke photo select karein ya khinchein</div>
            </div>
            
            <button type="submit" class="btn btn-gold-action"><i class="fa fa-paper-plane me-2"></i> Submit Registration</button>
        </form>
    </div>

    <script>
        function previewSelectedPhoto() {
            const file = document.getElementById('photoInput').files[0];
            const container = document.getElementById('previewContainer');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) { container.innerHTML = `<img src="${e.target.result}">`; }
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
